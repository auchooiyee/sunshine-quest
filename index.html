<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163d33"><meta name="description" content="MathWithCYE Sunshine Math Quest: five Form 4 mathematics adventure routes, a connected final expedition and local teacher missions.">
<title>MathWithCYE · Sunshine Math Quest</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='34'%3E🌿%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
<header class="masthead"><a class="brand" href="./"><span class="brand-symbol" aria-hidden="true">✳</span><span><b>MATHWITHCYE</b><small>SUNSHINE MATH QUEST</small></span></a><span class="tagline" data-i18n="tagline"></span><div class="header-actions"><button id="language" class="language" aria-label="Language / Bahasa">EN / BM</button><button id="teacher-button" class="outline" data-i18n="teacher"></button><button id="journal-button" class="outline" data-i18n="journal"></button></div></header>
<div id="class-banner" class="class-banner" hidden><span id="class-label"></span><button id="leave-class" class="text-button" data-i18n="leaveClass"></button></div>
<main class="expedition">
<aside class="sidebar"><span class="eyebrow" data-i18n="course"></span><h1 data-i18n="region"></h1><p class="region-description" data-i18n="lesson"></p><div class="chapter-meta"><span data-i18n="chapter"></span><span class="tiny-dot"></span><span id="region-number">01 / 05</span></div><p id="question-set" class="question-set"></p><button id="region-button" class="region-button" data-i18n="regions"></button><div class="sidebar-divider"></div><span class="eyebrow" data-i18n="map"></span><ol id="mission-list" class="mission-list"></ol><div class="objective-card"><span class="eyebrow" data-i18n="objective"></span><p id="objective-text"></p><button id="checkpoint" class="text-button" data-i18n="checkpoint"></button></div><label class="assist-setting"><input type="checkbox" id="assist" checked><span data-i18n="assist"></span></label><small class="setting-note" data-i18n="assistNote"></small><div class="sidebar-bottom"><span class="prototype-tag" data-i18n="prototype"></span><p data-i18n="evidenceNote"></p></div></aside>
<section class="game-column" aria-label="Forest adventure">
<div class="game-topbar"><span><span class="status-dot"></span><b data-i18n="explore"></b><span class="topbar-divider">/</span><span data-i18n="region"></span></span><div><button id="sound-button" class="small-button" aria-pressed="false" data-i18n="sound"></button><button id="pause-button" class="small-button" data-i18n="pause"></button></div></div>
<div id="stage" class="stage" tabindex="0" aria-label="Move with A/D or arrows. Space to jump. J to collect. E to interact.">
<canvas id="world" width="1200" height="620" aria-label="Sunshine forest adventure"></canvas><div class="vignette"></div>
<div class="hud"><div class="player-plaque"><img src="assets/hero.png" alt="Explorer"><div><span class="tiny-label">CYE EXPLORER</span><span id="hearts"></span></div></div><div class="resource-plaque"><span><img src="assets/wood.png" alt=""><b id="wood-count">0</b><small data-i18n="wood"></small></span><span><img src="assets/stone.png" alt=""><b id="stone-count">0</b><small data-i18n="stone"></small></span></div></div>
<div id="location" class="location-label"></div><div class="equipment"><button id="equip-sword" aria-pressed="true"><kbd>1</kbd><span data-i18n="sword"></span></button><button id="equip-axe" aria-pressed="false"><kbd>2</kbd><span data-i18n="axe"></span></button></div><button id="interaction" class="interaction" hidden><kbd>E</kbd><span></span><span aria-hidden="true">↗</span></button><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="intro" class="intro-overlay"><div class="intro-card"><span class="eyebrow" data-i18n="course"></span><h2 data-i18n="introTitle"></h2><p data-i18n="introText"></p><button id="start-button" class="primary" data-i18n="start" disabled></button><small data-i18n="introNote"></small></div><span class="intro-region" data-i18n="region"></span></div>
<div id="pause-overlay" class="pause-overlay" hidden><div class="pause-card"><span class="eyebrow">MATHWITHCYE</span><h2 data-i18n="paused"></h2><p data-i18n="pausedText"></p><button id="resume-button" class="primary" data-i18n="resume"></button></div></div><div id="loading" class="loading" role="status" data-i18n="loading"></div>
</div>
<div class="trail"><span data-i18n="trailHome"></span><div id="trail-track"><div id="trail-progress"></div><i id="trail-player"></i></div><span data-i18n="trailGuardian"></span></div>
<div class="touch-controls" aria-label="Touch controls"><div><button data-control="left" aria-label="Move left">←</button><button data-control="right" aria-label="Move right">→</button></div><div><button data-control="jump" data-i18n="jump"></button><button data-control="attack" data-i18n="action"></button><button data-control="interact" data-i18n="interact"></button></div></div>
<div class="below-game"><div class="controls-legend"><span><kbd>A</kbd><kbd>D</kbd> <span data-i18n="moveHelp"></span></span><span><kbd>SPACE</kbd> <span data-i18n="jumpHelp"></span></span><span><kbd>J</kbd> <span data-i18n="actionHelp"></span></span><span><kbd>E</kbd> <span data-i18n="interactHelp"></span></span></div><span id="save-status" class="save-status"></span></div>
<section id="supply-manifest" class="supply-manifest" hidden><span class="eyebrow" data-i18n="manifest"></span><div id="manifest-values"></div><small data-i18n="finalePrototype"></small></section><div class="expedition-stats"><div><span class="eyebrow">EXPEDITION XP</span><strong id="xp-total">0 <small>/ 450</small></strong><progress id="xp-progress" value="0" max="450" aria-label="Expedition XP"></progress></div><div><span class="eyebrow" data-i18n="independent"></span><strong id="independent-count">0 <small>/ 6</small></strong></div><div class="stat-note"><span class="leaf-mark" aria-hidden="true">❧</span><p data-i18n="questLead"></p></div></div>
</section></main>
<footer><span>© MathWithCYE <span class="footer-separator">/</span> <span data-i18n="footer"></span></span><a href="https://github.com/july-lyan/yoyo-sunshine-forest" target="_blank" rel="noopener" data-i18n="source"></a></footer>
</div>
<dialog id="challenge" aria-labelledby="challenge-title"><div class="dialog-top"><span id="challenge-eyebrow" class="eyebrow"></span><div><button id="challenge-language" class="language" aria-label="Language / Bahasa">EN / BM</button><button id="challenge-close" class="close-button" aria-label="Return to forest">×</button></div></div><h2 id="challenge-title"></h2><p id="challenge-prompt"></p><div class="challenge-layout"><div class="blueprint-panel"><div class="blueprint-header"><span data-i18n="blueprint"></span><code id="equation"></code></div><svg id="math-graph" viewBox="0 0 540 360" role="img" aria-label="Mathematical model"></svg><p id="graph-instructions" data-i18n="graphHelp"></p><div id="graph-summary" class="graph-summary"></div><button id="preview-action" class="outline" hidden data-i18n="previewPlan"></button></div><div class="answer-panel"><form id="answer-form"><div id="answer-fields"></div><button id="submit-answer" class="primary" type="submit" data-i18n="submit"></button></form><div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div><button id="continue-challenge" class="primary" hidden></button><div class="hint-panel"><span class="eyebrow" data-i18n="hintLabel"></span><ol id="hints"></ol><button id="hint-button" class="outline" data-i18n="hint"></button><small data-i18n="hintsAvailable"></small></div></div></div><div class="dialog-note" data-i18n="sessionSaved"></div></dialog>
<dialog id="journal" aria-labelledby="journal-title"><div class="dialog-top"><span class="eyebrow" data-i18n="journal"></span><button class="close-button" data-close="journal" aria-label="Close journal">×</button></div><h2 id="journal-title" data-i18n="journalTitle"></h2><p data-i18n="journalText"></p><div id="journal-summary" class="journal-summary"></div><p id="journal-regions" class="dialog-note"></p><div id="journal-records"></div><p class="dialog-note" data-i18n="evidenceNote"></p><section class="report-settings"><label for="report-label" data-i18n="reportLabel"></label><input id="report-label" type="text" maxlength="40" autocomplete="off"><p id="report-scope" class="dialog-note"></p><small data-i18n="csvNote"></small><p id="report-status" role="status"></p></section><p id="variant-note" class="dialog-note" data-i18n="variantNote"></p><div class="journal-actions"><button id="export-csv" class="primary" data-i18n="exportCSV"></button><button id="export-progress" class="outline" data-i18n="export"></button><button id="import-progress" class="outline" data-i18n="import"></button><input id="import-file" type="file" accept="application/json,.json" hidden><button id="next-variant" class="outline" data-i18n="nextVariant"></button><button id="restart-button" class="text-button" data-i18n="reset"></button></div><small data-i18n="exportNote"></small><div id="reset-confirm" class="reset-confirm" hidden><p id="reset-message" data-i18n="resetPrompt"></p><button id="confirm-restart" class="primary" data-i18n="confirmReset"></button><button id="cancel-restart" class="outline" data-i18n="cancel"></button></div></dialog>
<dialog id="completion" aria-labelledby="completion-title"><button class="close-button" data-close="completion" aria-label="Return to forest">×</button><span class="completion-emblem" aria-hidden="true">✳</span><span class="eyebrow" data-i18n="completed"></span><h2 id="completion-title" data-i18n="finishedTitle"></h2><p data-i18n="finishedText"></p><div class="badge"><span aria-hidden="true">✦</span><strong data-i18n="badge"></strong></div><p class="dialog-note" data-i18n="badgeNote"></p><p id="completion-stats"></p><div id="completion-manifest" class="completion-manifest" hidden></div><button id="next-region" class="primary" data-i18n="nextRegion"></button><button id="review-button" class="primary" data-i18n="review"></button><button id="finish-exit" class="text-button" data-i18n="finishExit"></button></dialog>
<dialog id="workshop" aria-labelledby="workshop-title"><div class="dialog-top"><span class="eyebrow">MATH LAB</span><button class="close-button" data-close="workshop" aria-label="Close workshop">×</button></div><h2 id="workshop-title" data-i18n="craft"></h2><p data-i18n="craftText"></p><div id="recipe-list"></div><p class="dialog-note" data-i18n="workshopNote"></p></dialog>
<dialog id="region-map" aria-labelledby="region-map-title"><div class="dialog-top"><span class="eyebrow" data-i18n="course"></span><button class="close-button" data-close="region-map" aria-label="Close region map">×</button></div><h2 id="region-map-title" data-i18n="regionTitle"></h2><p data-i18n="regionText"></p><div id="course-progress" class="journal-summary"></div><div id="region-cards" class="region-grid"></div><section class="join-panel"><h3 data-i18n="joinTitle"></h3><form id="join-form"><label for="join-input" data-i18n="joinCode"></label><div class="join-row"><input id="join-input" type="text" maxlength="2048" autocomplete="off" spellcheck="false" required><button class="primary" type="submit" data-i18n="join"></button></div><p id="join-error" role="status"></p></form><small data-i18n="joinText"></small></section></dialog>
<dialog id="teacher" aria-labelledby="teacher-title"><div class="dialog-top"><span class="eyebrow" data-i18n="teacher"></span><button class="close-button" data-close="teacher" aria-label="Close teacher mode">×</button></div><h2 id="teacher-title" data-i18n="teacherTitle"></h2><p data-i18n="teacherText"></p><div class="teacher-settings"><label><span data-i18n="teacherChapter"></span><select id="teacher-world"></select></label><label><span data-i18n="taskLength"></span><select id="teacher-tasks"><option value="3" data-i18n="threeTasks"></option><option value="6" data-i18n="sixTasks" selected></option><option value="5" data-i18n="finaleTasks" hidden disabled></option></select></label><label><span data-i18n="questionSet"></span><select id="teacher-variant"><option value="0" data-i18n="setOriginal"></option><option value="1" data-i18n="setB"></option><option value="2" data-i18n="setC"></option></select></label><label><span data-i18n="supportLevel"></span><select id="teacher-support"><option value="independent" data-i18n="independentMode"></option><option value="guided" data-i18n="guided"></option></select></label><label><span data-i18n="teacherLanguage"></span><select id="teacher-language"><option value="en">English</option><option value="ms">Bahasa Melayu</option></select></label><label class="teacher-checkbox"><input id="teacher-assist" type="checkbox" checked><span data-i18n="teacherAssist"></span></label></div><button id="generate-code" class="primary" data-i18n="makeCode"></button><div id="teacher-output" class="teacher-output" hidden><label><span data-i18n="taskCode"></span><textarea id="generated-code" readonly rows="3"></textarea></label><label><span data-i18n="taskLink"></span><input id="generated-link" readonly></label><div class="journal-actions"><button id="copy-class-link" class="outline" data-i18n="copyLink"></button><button id="launch-class" class="primary" data-i18n="launchClass"></button></div><small id="copy-status" role="status"></small><p class="dialog-note" data-i18n="localLinkNote"></p></div><details class="teacher-preview"><summary data-i18n="teacherPreview"></summary><p data-i18n="teacherPreviewNote"></p><p id="finale-teacher-note" data-i18n="finaleTeacherNote" hidden></p><ol id="teacher-answers"></ol></details><p class="dialog-note" data-i18n="classIsolated"></p></dialog>
<script type="module" src="app.js"></script>
</body></html>
